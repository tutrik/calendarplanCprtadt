<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Календар-план занять</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#193354;font:16px system-ui}header{background:#174177;color:white;padding:25px}main{max-width:1100px;margin:auto;padding:15px}.panel{background:#fff;margin:15px 0;padding:20px;border-radius:14px;box-shadow:0 2px 12px #1232}h1{margin:0}.days{display:grid;grid-template-columns:repeat(7,minmax(115px,1fr));gap:8px;overflow:auto}.day{background:#eef4fc;padding:10px;border-radius:10px}label{display:block;margin:8px 0 4px}input{width:100%;padding:8px;border:1px solid #ccd4dd;border-radius:6px;font:inherit}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}button{background:#2162b2;color:white;padding:11px 15px;border:0;border-radius:8px;cursor:pointer;margin:5px}.scroll{max-height:600px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:530px}td,th{border:1px solid #ddd;padding:10px;text-align:center}th{position:sticky;top:0;background:#eaf1f9}tr:nth-child(even){background:#f6f8fb}td input{max-width:85px}.months{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cell{min-height:88px;padding:7px;border:1px solid #dae3ee;border-radius:6px;font-size:13px}.off{background:#f0f0f2;color:#999}.cell small{display:block}.stats{display:flex;gap:18px;flex-wrap:wrap;font-weight:bold}.stats span{background:#eef4ff;padding:12px;border-radius:9px}@media(max-width:650px){.cell{font-size:10px;min-height:65px;padding:3px}}@media print{button,.config{display:none}.scroll{max-height:none;overflow:visible}}</style><header><h1>Календар-план занять</h1>Планування на всі 7 днів тижня</header><main><section class="panel config"><h2>Розклад за днями тижня</h2><div id="days" class="days"></div><h2>Період</h2><div class="fields"><label>Початок<input id="start" type="date"></label><label>Кінець<input id="end" type="date"></label><label>Годин на заняття<input id="dur" type="number" min=".25" step=".25" value="1"></label><label>Початок канікул<input id="hs" type="date"></label><label>Кінець канікул<input id="he" type="date"></label><label>Назва гуртка<input id="note" placeholder="Робототехніка"></label></div><label><input id="skip" type="checkbox" checked style="width:auto"> Пропускати канікули</label><button id="build">Побудувати</button><button id="save">Зберегти</button><button onclick="print()">Друк / PDF</button></section><section class="panel stats"><span>Занять: <b id="lessons">0</b></span><span>Годин: <b id="hours">0</b></span><span>Днів: <b id="count">0</b></span></section><section class="panel"><h2>Список занять за датами</h2><p>Можна змінювати кількість годин та видаляти окремі дати.</p><button id="reset">Скинути правки в таблиці</button><div class="scroll"><table><thead><tr><th>№</th><th>Дата</th><th>День</th><th>Занять</th><th>Годин</th><th>Дія</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><h2>Календар</h2><div id="months"></div></section></main><script>const $=x=>document.getElementById(x),names=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'],pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),date=s=>new Date(s+'T12:00:00');$('days').innerHTML=names.map((n,i)=>'<div class="day"><b>'+n+'</b><label>Занять<input type="number" min="0" step="1" id="l'+i+'" value="'+(i<5?2:0)+'"></label><label>Годин<input type="number" min="0" step=".25" id="h'+i+'" placeholder="Авто"></label></div>').join('');let now=new Date();$('start').value=key(new Date(now.getFullYear(),8,1));$('end').value=key(new Date(now.getFullYear()+1,4,31));let edits={};try{edits=JSON.parse(localStorage.getItem('calendar-edits')||'{}')}catch{}let entries=[];const num=x=>Math.max(0,Number(x)||0),fmt=n=>Number(n.toFixed(2)).toLocaleString('uk-UA'),saveEdits=()=>localStorage.setItem('calendar-edits',JSON.stringify(edits));function config(){return {start:$('start').value,end:$('end').value,dur:num($('dur').value)||1,hs:$('hs').value,he:$('he').value,note:$('note').value,skip:$('skip').checked,days:names.map((_,i)=>({lessons:num($('l'+i).value),hours:$('h'+i).value}))}}function rows(){let active=entries.filter(e=>!edits[e.key]?.removed);$('rows').innerHTML=active.map((e,i)=>{let z=edits[e.key]||{};return '<tr><td>'+(i+1)+'</td><td>'+e.key.split('-').reverse().join('.')+'</td><td>'+names[e.day]+'</td><td><input data-key="'+e.key+'" data-field="lessons" type="number" min="0" value="'+(z.lessons??e.lessons)+'"></td><td><input data-key="'+e.key+'" data-field="hours" type="number" min="0" step=".25" value="'+(z.hours??e.hours)+'"></td><td><button data-remove="'+e.key+'">×</button></td></tr>'}).join('');$('lessons').textContent=fmt(active.reduce((a,e)=>a+num(edits[e.key]?.lessons??e.lessons),0));$('hours').textContent=fmt(active.reduce((a,e)=>a+num(edits[e.key]?.hours??e.hours),0));$('count').textContent=active.length}function build(){let s=config();if(!s.start||!s.end||s.start>s.end)return alert('Перевірте дати');if((date(s.end)-date(s.start))/86400000>3660)return alert('Максимум 10 років');entries=[];let out='',m=new Date(date(s.start).getFullYear(),date(s.start).getMonth(),1);while(key(m)<=s.end){let y=m.getFullYear(),mo=m.getMonth();out+='<h3>'+new Intl.DateTimeFormat('uk-UA',{month:'long',year:'numeric'}).format(m)+'</h3><div class="months">'+names.map(n=>'<b style="text-align:center">'+n+'</b>').join('');for(let j=0;j<(m.getDay()+6)%7;j++)out+='<div></div>';for(let d=1;d<=new Date(y,mo+1,0).getDate();d++){let dt=new Date(y,mo,d,12),k=key(dt),idx=(dt.getDay()+6)%7,inrange=k>=s.start&&k<=s.end,holiday=s.skip&&s.hs&&s.he&&k>=s.hs&&k<=s.he,day=s.days[idx],l=inrange&&!holiday?day.lessons:0,h=inrange&&!holiday?(day.hours!==''?num(day.hours):l*s.dur):0;if(l||h)entries.push({key:k,day:idx,lessons:l,hours:h});out+='<div class="cell '+(!inrange||holiday?'off':'')+'"><b>'+d+'</b>'+(holiday?'<small>Канікули</small>':(l||h)?'<small>'+l+' занять<br>'+fmt(h)+' год</small>':'')+'</div>'}out+='</div>';m=new Date(y,mo+1,1)}$('months').innerHTML=out;rows()}$('rows').onchange=e=>{let t=e.target;if(!t.dataset.key)return;(edits[t.dataset.key]??={})[t.dataset.field]=num(t.value);saveEdits();rows()};$('rows').onclick=e=>{let k=e.target.dataset.remove;if(k){(edits[k]??={}).removed=true;saveEdits();rows()}};$('reset').onclick=()=>{edits={};saveEdits();build()};$('build').onclick=build;$('save').onclick=()=>{localStorage.setItem('calendar-config',JSON.stringify(config()));alert('Збережено')};try{let s=JSON.parse(localStorage.getItem('calendar-config')||'null');if(s){for(let n of ['start','end','hs','he','note'])$(n).value=s[n]||'';$('dur').value=s.dur;$('skip').checked=s.skip;s.days.forEach((d,i)=>{$('l'+i).value=d.lessons;$('h'+i).value=d.hours})}}catch{}build();</script></html>
